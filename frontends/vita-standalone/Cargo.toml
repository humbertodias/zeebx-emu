[package]
name = "zeebx-vita"
version = "0.4.3"
edition = "2024"
license = "GPL-2.0-or-later"
description = "O Zeebx na PlayStation Vita, sem Libretro"
publish = false

[[bin]]
name = "zeebx-vita"
path = "src/main.rs"

[dependencies]
# Sem `desktop` e sem `audio`. O `audio` é o `cpal`, que não tem porta na Vita; o som sai pela
# `sceAudioOut` daqui. Sem `gl`: o vitaGL não entrega OpenGL ES 3, e o quadro é o RGB565 do
# rasterizador de processador, pintado no framebuffer do aparelho.
zeebx = { path = "../..", default-features = false }

[build-dependencies]
cc = "1.0"
